<!doctype html>
<!-- The README proof board: the render, the hem close-up and the masks in UV
     space, from docs/source/make_demo.py's output folder (passed as ?dir=).
     Screenshot at 1200 x 794 (see docs/source/shoot.ps1). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .board { width: 1152px; padding: 24px; background: #161B24; border-radius: 26px;
           display: grid; grid-template-columns: 632px 504px; grid-template-rows: 520px 210px;
           gap: 16px; }
  .cell { background: #1F2633; border-radius: 16px; overflow: hidden; position: relative; }
  .render img { position: absolute; width: 925px; left: -146px; top: -142px; }
  .close img { position: absolute; width: 780px; left: -138px; top: -151px; }
  .uv { grid-column: 1 / 3; }
  .uv img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="board">
  <div class="cell render"><img id="render"></div>
  <div class="cell close"><img id="close"></div>
  <div class="cell uv"><img id="uv"></div>
</div>
<script>
  const dir = new URLSearchParams(location.search).get("dir");
  document.getElementById("render").src = dir + "/render.png";
  document.getElementById("close").src = dir + "/closeup.png";
  document.getElementById("uv").src = dir + "/uv_masks.png";
</script>
</body>
</html>
