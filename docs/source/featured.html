<!doctype html>
<!-- Featured image for the Blender Extensions listing, 1920 x 1080.
     The skirt is docs/source/proof's F_skirt.png (proof/index.html, shots());
     ?dir= points at the folder it is in (proof/out). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #161B24; overflow: hidden; }
  .text { position: absolute; left: 128px; top: 300px; width: 860px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .eyebrow { font-family: ui-monospace, Consolas, monospace; font-size: 30px; letter-spacing: 3px;
             color: #8A93A6; }
  h1 { margin: 18px 0 30px; font-size: 124px; font-weight: 700; color: #EFE7D8; line-height: 1; }
  p { margin: 0; font-size: 42px; line-height: 1.35; color: #8A93A6; }
  .render { position: absolute; right: 60px; top: 40px; width: 1080px; }
  svg { position: absolute; left: 0; bottom: 0; }
</style>
</head>
<body>
<div class="text">
  <div class="eyebrow">RIZUM · BLENDER ADD-ON</div>
  <h1>Pattern Masks</h1>
  <p>Stitches, line art and grids that follow the mesh, baked to UV masks for Painter.</p>
</div>
<img class="render" id="render">
<svg id="hem" width="1920" height="140" viewBox="0 0 1920 140"></svg>
<script>
  const dir = new URLSearchParams(location.search).get("dir");
  document.getElementById("render").src = dir + "/F_skirt.png";
  // the motif: a scalloped hem, the stitch line inset with sharp points at the cusps
  const n = 12, W = 1920, y = 60, depth = 32, w = W / n, half = w / 2;
  const r = (half * half + depth * depth) / (2 * depth), d = 22, rr = r - d;   // rr must stay above half
  let hem = `M 0 ${y} `, stitch = "";
  for (let i = 0; i < n; i++) {
    const cx = half + i * w, cy = y + depth - r;
    hem += `A ${r} ${r} 0 0 0 ${cx + half} ${y} `;
    const ly = cy + Math.sqrt(rr * rr - half * half);
    stitch += (i ? "L" : "M") + ` ${cx - half} ${ly} A ${rr} ${rr} 0 0 0 ${cx + half} ${ly} `;
  }
  document.getElementById("hem").innerHTML =
    `<path d="${hem} L ${W} 0 L 0 0 Z" fill="#161B24"/>` +
    `<path d="M 0 0 H ${W} V 140 H 0 Z" fill="#EFE7D8" opacity="0"/>` +
    `<path d="${hem}" fill="none" stroke="#22304A" stroke-width="10"/>` +
    `<path d="${stitch}" fill="none" stroke="#E8843A" stroke-width="9" stroke-linecap="round" stroke-dasharray="24 17"/>`;
  document.body.style.background =
    "linear-gradient(#161B24 0, #161B24 940px, #EFE7D8 940px)";
  document.getElementById("hem").style.bottom = "0px";
  document.getElementById("hem").style.top = "880px";
</script>
</body>
</html>
