    <h1>缝线</h1>
    <p class="lead">虚线或锯齿缝线，和边保持固定距离。</p>
    <section id="style"><h2>虚线和锯齿</h2>
<p>缝线有两种样式：一针一针分开的 <strong>虚线</strong>，和一根线来回走的 <strong>锯齿</strong>。</p>
<figure class="fig practice mini" id="demo-style" data-sandbox="{&quot;stitches&quot;: &quot;缝线&quot;, &quot;lineArt&quot;: &quot;线稿&quot;, &quot;auto&quot;: &quot;自动&quot;, &quot;fromEdge&quot;: &quot;向内偏移&quot;, &quot;width&quot;: &quot;宽度&quot;, &quot;none&quot;: &quot;无&quot;, &quot;add&quot;: &quot;添加&quot;, &quot;remove&quot;: &quot;移除&quot;, &quot;select&quot;: &quot;选择&quot;, &quot;clear&quot;: &quot;清空&quot;, &quot;pick&quot;: &quot;吸管&quot;, &quot;showEdges&quot;: &quot;显示标记的边&quot;, &quot;visible&quot;: &quot;显示并烘焙&quot;, &quot;skip&quot;: &quot;跳过这一步&quot;, &quot;restart&quot;: &quot;重来&quot;, &quot;edges&quot;: &quot;边&quot;, &quot;reference&quot;: &quot;引用&quot;, &quot;corners&quot;: &quot;尖角&quot;, &quot;flip&quot;: &quot;翻到另一侧&quot;, &quot;grid&quot;: &quot;格纹&quot;, &quot;along&quot;: &quot;沿边偏移&quot;, &quot;angle&quot;: &quot;角度&quot;, &quot;cell&quot;: &quot;格子大小&quot;, &quot;pickInList&quot;: &quot;在列表里点选&quot;, &quot;clickLayer&quot;: &quot;在列表里点一个图层&quot;, &quot;stop&quot;: &quot;不再引用&quot;, &quot;length&quot;: &quot;长度&quot;, &quot;gap&quot;: &quot;间隔&quot;, &quot;bake&quot;: &quot;烘焙遮罩&quot;, &quot;model&quot;: &quot;模型&quot;, &quot;live&quot;: &quot;实时更新&quot;, &quot;rebuild&quot;: &quot;刷新&quot;, &quot;keyEdges&quot;: &quot;这一层的边&quot;, &quot;keyOut&quot;: &quot;去掉的边&quot;, &quot;keyCorners&quot;: &quot;尖角&quot;, &quot;keySel&quot;: &quot;选中的边&quot;, &quot;presetName&quot;: &quot;下摆缝线&quot;, &quot;preDefault&quot;: &quot;默认值&quot;, &quot;preStar&quot;: &quot;设为默认&quot;, &quot;preName&quot;: &quot;预设名称&quot;, &quot;presets&quot;: &quot;缝线预设&quot;, &quot;showCorners&quot;: &quot;显示尖角&quot;, &quot;style&quot;: &quot;样式&quot;, &quot;dashed&quot;: &quot;虚线&quot;, &quot;zigzag&quot;: &quot;锯齿&quot;, &quot;height&quot;: &quot;高度&quot;, &quot;bakeHead&quot;: &quot;烘焙&quot;, &quot;background&quot;: &quot;背景&quot;, &quot;black&quot;: &quot;黑底&quot;, &quot;transparent&quot;: &quot;透明&quot;, &quot;white&quot;: &quot;白底&quot;, &quot;panelName&quot;: &quot;Rizum 图案遮罩&quot;, &quot;allMarks&quot;: &quot;显示标记&quot;, &quot;more&quot;: &quot;更多&quot;, &quot;clearAll&quot;: &quot;清空所有图层&quot;, &quot;clearRef&quot;: &quot;取消引用&quot;, &quot;refOf&quot;: &quot;也沿「{}」的边走&quot;, &quot;bake1&quot;: &quot;烘焙 1 层遮罩&quot;, &quot;bakeN&quot;: &quot;烘焙 {} 层遮罩&quot;, &quot;object&quot;: &quot;物体&quot;, &quot;material&quot;: &quot;材质&quot;, &quot;demo&quot;: &quot;style&quot;, &quot;steps&quot;: [&quot;把 **样式** 换成 **锯齿**。&quot;, &quot;把 **高度** 拖到 6 mm。&quot;, &quot;把 **向内偏移** 拖到 5 mm。&quot;], &quot;results&quot;: [&quot;现在是一根线来回走，面板里的 **间隔** 换成了 **高度**。&quot;, &quot;锯齿摆到了 {height} 宽，尖已经碰到下摆了。&quot;, &quot;整条线往里移到 {from}，尖又回到了布上。&quot;], &quot;done&quot;: &quot;换回 **虚线** 比较一下。&quot;}"></figure>
</section><section id="settings"><h2>参数</h2>

<figure class="fig refpanel" data-ref="stitch"><div class="rp-row" data-r="from"><div class="rp-ui"><span class="rp-lb">向内偏移</span><span class="rp-field">3 mm</span></div><div class="rp-desc">到边的距离，沿布面测量。</div></div><div class="rp-row" data-r="corner_inset"><div class="rp-ui"><span class="rp-lb">尖角加深</span><span class="rp-field">0 mm</span></div><div class="rp-desc">在标记的尖角处，再往里缩一点。</div></div><div class="rp-row" data-r="smooth"><div class="rp-ui"><span class="rp-lb">平滑</span><span class="rp-field">2 mm</span></div><div class="rp-desc">抹平低模在线上造成的折角。需要保持尖的地方标成尖角。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="style"><div class="rp-ui"><span class="rp-lb">样式</span><span class="rp-seg"><button type="button" data-v="dash" class=on>虚线</button><button type="button" data-v="zigzag">锯齿</button></span></div><div class="rp-desc"><strong>虚线</strong> 一针一针分开；<strong>锯齿</strong> 是一根线来回走。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="width"><div class="rp-ui"><span class="rp-lb">宽度</span><span class="rp-field">1.2 mm</span></div><div class="rp-desc">针脚宽度。锯齿时是线的粗细。</div></div><div class="rp-row" data-r="length"><div class="rp-ui"><span class="rp-lb">长度</span><span class="rp-field">4 mm</span></div><div class="rp-desc">针脚长度。锯齿时是两个尖之间的距离。</div></div><div class="rp-row" data-r="gap" data-show="dash"><div class="rp-ui"><span class="rp-lb">间隔</span><span class="rp-field">2 mm</span></div><div class="rp-desc">针脚之间的空隙。</div></div><div class="rp-row" data-r="round" data-show="dash"><div class="rp-ui"><span class="rp-lb">圆角</span><span class="rp-field slider" style="--f:100%">100%</span></div><div class="rp-desc">针脚两头有多圆，100% 是全圆。</div></div><div class="rp-row" data-r="height" data-show="zigzag"><div class="rp-ui"><span class="rp-lb">高度</span><span class="rp-field">3 mm</span></div><div class="rp-desc">锯齿左右摆动的幅度。调大时把 <strong>向内偏移</strong> 也调大。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="even" data-show="dash"><div class="rp-ui"><span class="rp-lb"></span><span class="rp-check"><i class="on"></i>均匀排布</span></div><div class="rp-desc">闭合的一圈排整数个针脚；不闭合的线两头留空一样多。</div></div></figure>
</section>
