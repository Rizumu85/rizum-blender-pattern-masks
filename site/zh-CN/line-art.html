    <h1>线稿</h1>
    <p class="lead">粗细一致的实线，可以是描边，也可以是色带。</p>
    <section id="what"><h2>画什么</h2>
<p>沿这一层的边画一条实线：在模型上处处一样宽，完全贴合边的形状，标记的尖角保持尖锐。线稿层想加几层都行。</p>
<figure class="fig practice mini" id="demo-lineart" data-sandbox="{&quot;stitches&quot;: &quot;缝线&quot;, &quot;lineArt&quot;: &quot;线稿&quot;, &quot;auto&quot;: &quot;自动&quot;, &quot;fromEdge&quot;: &quot;离边距离&quot;, &quot;width&quot;: &quot;宽度&quot;, &quot;none&quot;: &quot;无&quot;, &quot;add&quot;: &quot;添加&quot;, &quot;remove&quot;: &quot;移除&quot;, &quot;select&quot;: &quot;选择&quot;, &quot;clear&quot;: &quot;清空&quot;, &quot;pick&quot;: &quot;吸管&quot;, &quot;showEdges&quot;: &quot;显示标记的边&quot;, &quot;visible&quot;: &quot;显示并烘焙&quot;, &quot;skip&quot;: &quot;跳过这一步&quot;, &quot;restart&quot;: &quot;重来&quot;, &quot;edges&quot;: &quot;边&quot;, &quot;reference&quot;: &quot;引用&quot;, &quot;corners&quot;: &quot;尖角&quot;, &quot;flip&quot;: &quot;翻到另一侧&quot;, &quot;grid&quot;: &quot;格纹&quot;, &quot;along&quot;: &quot;沿边偏移&quot;, &quot;angle&quot;: &quot;角度&quot;, &quot;cell&quot;: &quot;格子大小&quot;, &quot;pickInList&quot;: &quot;在列表里点选&quot;, &quot;clickLayer&quot;: &quot;在列表里点一个图层&quot;, &quot;stop&quot;: &quot;不再引用&quot;, &quot;length&quot;: &quot;长度&quot;, &quot;gap&quot;: &quot;间隔&quot;, &quot;bake&quot;: &quot;烘焙遮罩&quot;, &quot;model&quot;: &quot;模型&quot;, &quot;live&quot;: &quot;实时更新&quot;, &quot;rebuild&quot;: &quot;刷新&quot;, &quot;keyEdges&quot;: &quot;这一层的边&quot;, &quot;keyOut&quot;: &quot;去掉的边&quot;, &quot;keyCorners&quot;: &quot;尖角&quot;, &quot;keySel&quot;: &quot;选中的边&quot;, &quot;presetName&quot;: &quot;下摆缝线&quot;, &quot;preDefault&quot;: &quot;默认值&quot;, &quot;preStar&quot;: &quot;设为默认&quot;, &quot;preName&quot;: &quot;预设名称&quot;, &quot;presets&quot;: &quot;缝线预设&quot;, &quot;showCorners&quot;: &quot;显示尖角&quot;, &quot;style&quot;: &quot;样式&quot;, &quot;dashed&quot;: &quot;虚线&quot;, &quot;zigzag&quot;: &quot;锯齿&quot;, &quot;height&quot;: &quot;高度&quot;, &quot;bakeHead&quot;: &quot;烘焙&quot;, &quot;background&quot;: &quot;背景&quot;, &quot;black&quot;: &quot;黑底&quot;, &quot;transparent&quot;: &quot;透明&quot;, &quot;bake1&quot;: &quot;烘焙 1 层遮罩&quot;, &quot;bakeN&quot;: &quot;烘焙 {} 层遮罩&quot;, &quot;object&quot;: &quot;物体&quot;, &quot;material&quot;: &quot;材质&quot;, &quot;demo&quot;: &quot;lineart&quot;, &quot;steps&quot;: [&quot;把 **离边距离** 拖到 3 mm。&quot;, &quot;把 **宽度** 拖到 5 mm。&quot;], &quot;results&quot;: [&quot;线离开下摆往里移了 {from}。**离边距离** 量的是到线外侧的距离。&quot;, &quot;描边变成了 {width} 宽的色带：处处一样宽，标记的尖处还是尖的。&quot;], &quot;done&quot;: &quot;把 **离边距离** 拖回 0，色带就贴着边。&quot;}"></figure>
</section><section id="settings"><h2>参数</h2>

<figure class="fig refpanel" data-ref="line"><div class="rp-row" data-r="from"><div class="rp-ui"><span class="rp-lb">离边距离</span><span class="rp-field">0 mm</span></div><div class="rp-desc">边到线外侧的距离，0 就是描边。</div></div><div class="rp-row" data-r="corner_inset"><div class="rp-ui"><span class="rp-lb">尖角内缩</span><span class="rp-field">0 mm</span></div><div class="rp-desc">在标记的尖角处，再往里缩一点。</div></div><div class="rp-row" data-r="smooth"><div class="rp-ui"><span class="rp-lb">平滑</span><span class="rp-field">0 mm</span></div><div class="rp-desc">让两个尖角之间的线内侧更圆滑。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="width"><div class="rp-ui"><span class="rp-lb">宽度</span><span class="rp-field">0.5 mm</span></div><div class="rp-desc">线宽，在模型上处处一样。</div></div></figure>
</section>
