    <h1>線画</h1>
    
    <section id="what">
<p>マークした辺に線を引き、辺の形にぴったり沿います。スムーズを使うときも、角をマークすればシャープなまま残せます。</p>
<figure class="fig practice mini" id="demo-lineart" data-sandbox="{&quot;stitches&quot;: &quot;ステッチ&quot;, &quot;lineArt&quot;: &quot;線画&quot;, &quot;auto&quot;: &quot;自動&quot;, &quot;fromEdge&quot;: &quot;内側オフセット&quot;, &quot;width&quot;: &quot;幅&quot;, &quot;none&quot;: &quot;なし&quot;, &quot;add&quot;: &quot;追加&quot;, &quot;remove&quot;: &quot;外す&quot;, &quot;select&quot;: &quot;選択&quot;, &quot;clear&quot;: &quot;消去&quot;, &quot;pick&quot;: &quot;スポイト&quot;, &quot;showEdges&quot;: &quot;辺を表示&quot;, &quot;visible&quot;: &quot;表示とベイク&quot;, &quot;skip&quot;: &quot;このステップを飛ばす&quot;, &quot;restart&quot;: &quot;最初から&quot;, &quot;edges&quot;: &quot;辺&quot;, &quot;reference&quot;: &quot;参照&quot;, &quot;corners&quot;: &quot;尖った角&quot;, &quot;flip&quot;: &quot;反対側&quot;, &quot;grid&quot;: &quot;チェック柄&quot;, &quot;along&quot;: &quot;線方向オフセット&quot;, &quot;angle&quot;: &quot;角度&quot;, &quot;cell&quot;: &quot;マスの大きさ&quot;, &quot;pickInList&quot;: &quot;リストから選ぶ&quot;, &quot;clickLayer&quot;: &quot;リストのレイヤーをクリックしてください&quot;, &quot;stop&quot;: &quot;参照をやめる&quot;, &quot;length&quot;: &quot;長さ&quot;, &quot;gap&quot;: &quot;間隔&quot;, &quot;bake&quot;: &quot;マスクをベイク&quot;, &quot;model&quot;: &quot;モデル&quot;, &quot;live&quot;: &quot;自動更新&quot;, &quot;rebuild&quot;: &quot;更新&quot;, &quot;keyEdges&quot;: &quot;このレイヤーの辺&quot;, &quot;keyOut&quot;: &quot;外した辺&quot;, &quot;keyCorners&quot;: &quot;尖った角&quot;, &quot;keySel&quot;: &quot;選択中の辺&quot;, &quot;presetName&quot;: &quot;裾のステッチ&quot;, &quot;preDefault&quot;: &quot;デフォルト&quot;, &quot;preStar&quot;: &quot;初期値にする&quot;, &quot;preName&quot;: &quot;プリセット名&quot;, &quot;presets&quot;: &quot;ステッチのプリセット&quot;, &quot;showCorners&quot;: &quot;角を表示&quot;, &quot;style&quot;: &quot;スタイル&quot;, &quot;dashed&quot;: &quot;破線&quot;, &quot;zigzag&quot;: &quot;ジグザグ&quot;, &quot;height&quot;: &quot;高さ&quot;, &quot;bakeHead&quot;: &quot;ベイク&quot;, &quot;background&quot;: &quot;背景&quot;, &quot;black&quot;: &quot;黒&quot;, &quot;transparent&quot;: &quot;透明&quot;, &quot;white&quot;: &quot;白&quot;, &quot;panelName&quot;: &quot;Rizum パターンマスク&quot;, &quot;allMarks&quot;: &quot;マークを表示&quot;, &quot;more&quot;: &quot;その他&quot;, &quot;clearAll&quot;: &quot;すべてのレイヤーをクリア&quot;, &quot;clearRef&quot;: &quot;参照を解除&quot;, &quot;refOf&quot;: &quot;「{}」の辺にも沿っています&quot;, &quot;bake1&quot;: &quot;マスクを 1 枚ベイク&quot;, &quot;bakeN&quot;: &quot;マスクを {} 枚ベイク&quot;, &quot;object&quot;: &quot;オブジェクト&quot;, &quot;material&quot;: &quot;マテリアル&quot;, &quot;demo&quot;: &quot;lineart&quot;, &quot;steps&quot;: [&quot;**内側オフセット** を 3 mm までドラッグします。&quot;, &quot;**幅** を 5 mm までドラッグします。&quot;], &quot;results&quot;: [&quot;線が裾から {from} 内側へ移りました。**内側オフセット** は線の外側までの距離です。&quot;, &quot;縁取りが幅 {width} の帯になりました。幅はどこも同じで、マークした先はシャープなままです。&quot;], &quot;done&quot;: &quot;**内側オフセット** を 0 に戻すと、帯が辺にぴったり付きます。&quot;}"></figure>
</section><section id="settings"><h2>設定</h2>

<figure class="fig refpanel" data-ref="line"><div class="rp-row" data-r="from"><div class="rp-ui"><span class="rp-lb">内側オフセット</span><span class="rp-field">0 mm</span></div><div class="rp-desc">マークした辺から内側へ入れる距離（線の外側まで）。0 で辺の縁取りになります。</div></div><div class="rp-row" data-r="corner_inset"><div class="rp-ui"><span class="rp-lb">角の深さ</span><span class="rp-field">0 mm</span></div><div class="rp-desc">マークした角で、さらに内側へ入れる距離。</div></div><div class="rp-row" data-r="smooth"><div class="rp-ui"><span class="rp-lb">スムーズ</span><span class="rp-field">0 mm</span></div><div class="rp-desc">線の内側をなめらかにします。外側は辺に沿ったままです。尖らせたい所は角としてマークします。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="width"><div class="rp-ui"><span class="rp-lb">幅</span><span class="rp-field">0.5 mm</span></div><div class="rp-desc">線の太さ。モデル上のどこでも同じ太さに保ちます。</div></div></figure>
</section>
