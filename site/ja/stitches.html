    <h1>ステッチ</h1>
    
    <section id="style"><h2>破線とジグザグ</h2>
<p>スタイルは 2 種類です。1 針ずつ離れた <strong>破線</strong> と、1 本の糸が行き来する <strong>ジグザグ</strong>。</p>
<figure class="fig practice mini" id="demo-style" data-sandbox="{&quot;stitches&quot;: &quot;ステッチ&quot;, &quot;lineArt&quot;: &quot;線画&quot;, &quot;auto&quot;: &quot;自動&quot;, &quot;fromEdge&quot;: &quot;内側オフセット&quot;, &quot;width&quot;: &quot;幅&quot;, &quot;none&quot;: &quot;なし&quot;, &quot;add&quot;: &quot;追加&quot;, &quot;remove&quot;: &quot;外す&quot;, &quot;select&quot;: &quot;選択&quot;, &quot;clear&quot;: &quot;消去&quot;, &quot;pick&quot;: &quot;スポイト&quot;, &quot;showEdges&quot;: &quot;辺を表示&quot;, &quot;visible&quot;: &quot;表示とベイク&quot;, &quot;skip&quot;: &quot;このステップを飛ばす&quot;, &quot;restart&quot;: &quot;最初から&quot;, &quot;edges&quot;: &quot;辺&quot;, &quot;reference&quot;: &quot;参照&quot;, &quot;corners&quot;: &quot;尖った角&quot;, &quot;flip&quot;: &quot;反対側&quot;, &quot;grid&quot;: &quot;チェック柄&quot;, &quot;along&quot;: &quot;線方向オフセット&quot;, &quot;angle&quot;: &quot;角度&quot;, &quot;cell&quot;: &quot;マスの大きさ&quot;, &quot;pickInList&quot;: &quot;リストから選ぶ&quot;, &quot;clickLayer&quot;: &quot;リストのレイヤーをクリックしてください&quot;, &quot;stop&quot;: &quot;参照をやめる&quot;, &quot;length&quot;: &quot;長さ&quot;, &quot;gap&quot;: &quot;間隔&quot;, &quot;bake&quot;: &quot;マスクをベイク&quot;, &quot;model&quot;: &quot;モデル&quot;, &quot;live&quot;: &quot;自動更新&quot;, &quot;rebuild&quot;: &quot;更新&quot;, &quot;keyEdges&quot;: &quot;このレイヤーの辺&quot;, &quot;keyOut&quot;: &quot;外した辺&quot;, &quot;keyCorners&quot;: &quot;尖った角&quot;, &quot;keySel&quot;: &quot;選択中の辺&quot;, &quot;presetName&quot;: &quot;裾のステッチ&quot;, &quot;preDefault&quot;: &quot;デフォルト&quot;, &quot;preStar&quot;: &quot;初期値にする&quot;, &quot;preName&quot;: &quot;プリセット名&quot;, &quot;presets&quot;: &quot;ステッチのプリセット&quot;, &quot;showCorners&quot;: &quot;角を表示&quot;, &quot;style&quot;: &quot;スタイル&quot;, &quot;dashed&quot;: &quot;破線&quot;, &quot;zigzag&quot;: &quot;ジグザグ&quot;, &quot;height&quot;: &quot;高さ&quot;, &quot;bakeHead&quot;: &quot;ベイク&quot;, &quot;background&quot;: &quot;背景&quot;, &quot;black&quot;: &quot;黒&quot;, &quot;transparent&quot;: &quot;透明&quot;, &quot;white&quot;: &quot;白&quot;, &quot;panelName&quot;: &quot;Rizum パターンマスク&quot;, &quot;allMarks&quot;: &quot;マークを表示&quot;, &quot;more&quot;: &quot;その他&quot;, &quot;clearAll&quot;: &quot;すべてのレイヤーをクリア&quot;, &quot;clearRef&quot;: &quot;参照を解除&quot;, &quot;refOf&quot;: &quot;「{}」の辺にも沿っています&quot;, &quot;bake1&quot;: &quot;マスクを 1 枚ベイク&quot;, &quot;bakeN&quot;: &quot;マスクを {} 枚ベイク&quot;, &quot;object&quot;: &quot;オブジェクト&quot;, &quot;material&quot;: &quot;マテリアル&quot;, &quot;demo&quot;: &quot;style&quot;, &quot;steps&quot;: [&quot;**スタイル** を **ジグザグ** に切り替えます。&quot;, &quot;**高さ** を 6 mm までドラッグします。&quot;, &quot;**内側オフセット** を 5 mm までドラッグします。&quot;], &quot;results&quot;: [&quot;1 本の糸が行き来するステッチになり、パネルの **間隔** が **高さ** に変わりました。&quot;, &quot;ジグザグの振れ幅が {height} になり、山が裾に届きました。&quot;, &quot;線全体が {from} の位置まで内側に移り、山が布の上に戻りました。&quot;], &quot;done&quot;: &quot;**破線** に戻して比べてみてください。&quot;}"></figure>
</section><section id="settings"><h2>設定</h2>

<figure class="fig refpanel" data-ref="stitch"><div class="rp-row" data-r="from"><div class="rp-ui"><span class="rp-lb">内側オフセット</span><span class="rp-field">3 mm</span></div><div class="rp-desc">マークした辺から内側へ入れる距離。</div></div><div class="rp-row" data-r="corner_inset"><div class="rp-ui"><span class="rp-lb">角の深さ</span><span class="rp-field">0 mm</span></div><div class="rp-desc">マークした角で、さらに内側へ入れる距離。</div></div><div class="rp-row" data-r="smooth"><div class="rp-ui"><span class="rp-lb">スムーズ</span><span class="rp-field">2 mm</span></div><div class="rp-desc">ローポリの弧をなめらかにします。尖らせたい所は角としてマークします。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="style"><div class="rp-ui"><span class="rp-lb">スタイル</span><span class="rp-seg"><button type="button" data-v="dash" class=on>破線</button><button type="button" data-v="zigzag">ジグザグ</button></span></div><div class="rp-desc"><strong>破線</strong> は 1 針ずつ離れたステッチ、<strong>ジグザグ</strong> は 1 本の糸の行き来です。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="width"><div class="rp-ui"><span class="rp-lb">幅</span><span class="rp-field">1.2 mm</span></div><div class="rp-desc">1 針ごとの幅。</div></div><div class="rp-row" data-r="length"><div class="rp-ui"><span class="rp-lb">長さ</span><span class="rp-field">4 mm</span></div><div class="rp-desc">1 針ごとの長さ。</div></div><div class="rp-row" data-r="gap" data-show="dash"><div class="rp-ui"><span class="rp-lb">間隔</span><span class="rp-field">2 mm</span></div><div class="rp-desc">ステッチ同士の間隔。</div></div><div class="rp-row" data-r="round" data-show="dash"><div class="rp-ui"><span class="rp-lb">端の丸み</span><span class="rp-field slider" style="--f:100%">100%</span></div><div class="rp-desc">1 針ごとの端の丸み。</div></div><div class="rp-row" data-r="height" data-show="zigzag"><div class="rp-ui"><span class="rp-lb">高さ</span><span class="rp-field">3 mm</span></div><div class="rp-desc">ジグザグの振れ幅。上げたら <strong>内側オフセット</strong> も上げます。</div></div><div class="rp-gap"></div><div class="rp-row" data-r="even" data-show="dash"><div class="rp-ui"><span class="rp-lb"></span><span class="rp-check"><i class="on"></i>均等に配置</span></div><div class="rp-desc multi"><span>ステッチの長さと間隔を少し調整して、線にぴったり収めます。</span><span><strong>閉じたループ</strong>：オフだと継ぎ目に半端なすき間が残ります。オンにすると 1 針ずつ少し伸び縮みして、継ぎ目が目立ちません。</span><span><strong>開いた線</strong>：オフだと余りが片方の端にまとまります。オンにすると両端に振り分けます。</span></div></div></figure>
</section>
